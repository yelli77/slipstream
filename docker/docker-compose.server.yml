version: '3.8'
services:
  startruckmp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: startruckmp-dedicated-1
    ports:
      - "7777:7777/udp"
    environment:
      - SERVER_PORT=7777
      - MAX_CLIENTS=20
      - SERVER_NAME=StarTruckMP Server
      - STARTTRUCKMP_BRIDGE_URL=http://discord-bridge-bot:4500
      - MIN_CLIENT_BUILD=152
      # custom-build-348: Pioneer-Badge — Spielzeit-/Pionier-Daten IM Container-User-Home
      # persistieren; auf dem VPS wird via Volume /app/data -> Host gemountet.
      - STARTTRUCKMP_PLAYTIME_PATH=/app/data/playtime.json
      - STARTTRUCKMP_PIONEERS_PATH=/app/data/pioneers.json
    volumes:
      - /opt/data/startruckmp-dedicated-data:/app/data
    restart: unless-stopped
