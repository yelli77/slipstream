version: '3.8'
services:
  startruckmp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: startruckmp-dedicated-1
    ports:
      - "7777:7777/udp"
    environment:
      - SERVER_PORT=7777
      - MAX_CLIENTS=8
      - SERVER_NAME=StarTruckMP Server
      - STARTTRUCKMP_BRIDGE_URL=http://discord-bridge-bot:4500
    restart: unless-stopped
